<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LG Smart Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ece9e6, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 40px;
    }

    .phone {
      width: 360px;
      height: 640px;
      background: #000;
      border: 16px solid #222;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .phone::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 8px;
      background: #444;
      border-radius: 10px;
    }

    .phone::after {
      content: '';
      position: absolute;
      top: 10px;
      right: 25px;
      width: 8px;
      height: 8px;
      background: #444;
      border-radius: 50%;
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lg-logo {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      opacity: 0.8;
    }

    .login-box {
      width: 320px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      text-align: center;
      color: #990033;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    .login-box input:focus {
      border-color: #990033;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #990033;
      border: none;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background-color: #7a0028;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LG Smartphone with video and camera notch -->
    <div class="phone">
      <video autoplay muted loop>
        <source src="lg_video.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <!-- LG logo -->
      <img class="lg-logo" src="lg_logo.png" alt="LG Logo" />
    </div>

    <!-- Login Box -->
    <div class="login-box">
      <h2>Sign Up / Login</h2>
      <input type="text" placeholder="Username" id="username"/>
      <input type="password" placeholder="Password" id="password"/>
      <button onclick="window.location.href='P3_details_intern.html'">Login</button>
    </div>
  </div>
</body>
</html>
