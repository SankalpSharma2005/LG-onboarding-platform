<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LG Smart Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ece9e6, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      gap: 60px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 40px;
    }

    .phone {
      width: 360px;
      height: 640px;
      background: #000;
      border: 16px solid #222;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .phone::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 8px;
      background: #444;
      border-radius: 10px;
    }

    .phone::after {
      content: '';
      position: absolute;
      top: 10px;
      right: 25px;
      width: 8px;
      height: 8px;
      background: #444;
      border-radius: 50%;
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lg-logo {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      opacity: 0.8;
    }

    .login-box {
      width: 320px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      text-align: center;
      color: #990033;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    .login-box input:focus {
      border-color: #990033;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #990033;
      border: none;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background-color: #7a0028;
    }

    #error-msg {
      color: red;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 30px;
      }
    }

    /* Password-mimic text input */
    .masked-input {
      font-family: password, sans-serif;
      -webkit-text-security: disc; /* for Safari */
      text-security: disc;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- LG Smartphone with video and camera notch -->
    <div class="phone">
      <video autoplay muted loop>
        <source src="lg_video.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <!-- LG logo -->
      <img class="lg-logo" src="lg_logo.png" alt="LG Logo" />
    </div>

    <!-- Login Box -->
    <div class="login-box">
      <h2>Sign Up / Login</h2>
      <input type="text" placeholder="Enter your employee code" id="username" autocomplete="off" />
      <input type="text" placeholder="Enter last 5 digits of employee code" id="digit" class="masked-input" autocomplete="off" inputmode="numeric"/>
      <p id="error-msg">Incorrect username/password</p>
      <button onclick="validateLogin()">Login</button>
    </div>
  </div>

  <script>
    function validateLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("digit").value.trim();
      const errorMsg = document.getElementById("error-msg");

      // Username must be 1 letter followed by 5 digits
      const usernamePattern = /^[A-Za-z][0-9]{5}$/;

      if (usernamePattern.test(username)) {
        const expectedPassword = username.slice(1); // Get the last 5 digits
        if (password === expectedPassword) {
          errorMsg.style.display = "none";
          window.location.href = "P3_details_Emp.html";
          return;
        }
      }

      // Show error
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
